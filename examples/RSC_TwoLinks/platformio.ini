; RSC_TwoLinks on a generic ESP32 board (esp32dev): two ReliableSerialComms links on Serial1 and Serial2,
; each served by its own FreeRTOS task, and a requester task that waits for every answer.
;
; Wiring:
;   GPIO 19 (Serial1 TX) -> GPIO 16 (Serial2 RX)
;   GPIO 17 (Serial2 TX) -> GPIO 18 (Serial1 RX)
;
;   pio run -t upload --upload-port COM5             build and flash
;   pio device monitor --port COM5                   results at 115200
;
; The library is linked from this repository (symlink://), so library edits apply at the next build.
; Outside this repository, replace symlink://../.. with the library's git URL.
; The stock platform at a fixed version builds with Arduino core 2.0.17. The README gives the
; pioarduino platform line for Arduino core 3.x.

[platformio]
src_dir = .
default_envs = esp32dev

[env:esp32dev]
platform = platformio/espressif32 @ 7.1.3
board = esp32dev
framework = arduino
monitor_speed = 115200
build_src_filter = +<*> -<.pio/>
lib_deps =
	symlink://../..
build_flags =
	-Wall -Wextra
