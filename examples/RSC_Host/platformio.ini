; RSC_Host on a generic ESP32 board (esp32dev): a ReliableSerialComms responder on the USB serial port.
;
;   pio run -t upload --upload-port COM5             build and flash
;   python ../../python/examples/host_demo.py COM5   talk to it from the computer
;
; Serial carries the protocol, so the board prints nothing, and a serial monitor must not hold the port.
;
; The library is linked from this repository (symlink://), so library edits apply at the next build.
; Outside this repository, replace symlink://../.. with the library's git URL.
; The stock platform at a fixed version builds with Arduino core 2.0.17. The README gives the
; pioarduino platform line for Arduino core 3.x.

[platformio]
src_dir = .
default_envs = esp32dev

[env:esp32dev]
platform = platformio/espressif32 @ 7.1.3
board = esp32dev
framework = arduino
build_src_filter = +<*> -<.pio/>
lib_deps =
	symlink://../..
build_flags =
	-Wall -Wextra
