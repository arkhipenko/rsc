# Continuous integration for ReliableSerialComms
# - host tests (tests/host) with AddressSanitizer and UndefinedBehaviorSanitizer: two links joined
#   by a simulated wire with faults, in three configurations; C++ syntax check of the sources
# - Python tests (python/tests): codec, two Python links, and interop with the C library
#   (tests/interop/c_peer.c) over pipes, including a lossy pipe and a peer restart
# - example sketches on arduino-esp32 3.x (ESP32, ESP32-C3), 2.0.17 (ESP32) and Arduino AVR (Uno)
#   (examples/rsc_stm32 is an STM32CubeIDE fragment and is not compiled)
# - the PlatformIO projects of RSC_Host and RSC_TwoLinks (esp32dev), as published
# - Arduino Lint (the library is not in the Library Manager)

name: CI

on:
  push:
    branches: [main, testing]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  host-tests:
    name: Host tests (${{ matrix.compiler }}, ${{ matrix.std }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        compiler: [g++, clang++]
        std: [gnu++11, c++17, c++20]
    steps:
      - uses: actions/checkout@v7
      - name: Build and run
        run: make -C tests/host CXX=${{ matrix.compiler }} STD=${{ matrix.std }}

  python:
    name: Python ${{ matrix.python }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.9", "3.12"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Install
        run: python -m pip install pyserial pytest
      - name: Build the C peer
        run: make -C tests/interop c_peer
      - name: Test
        working-directory: python
        run: python -m pytest -q tests

  examples:
    name: Examples (${{ matrix.name }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: arduino-esp32 3.x, ESP32
            fqbn: esp32:esp32:esp32
            platforms: |
              - name: esp32:esp32
                source-url: https://espressif.github.io/arduino-esp32/package_esp32_index.json
            sketches: |
              - examples/RSC_Host
              - examples/RSC_TwoLinks
          - name: arduino-esp32 3.x, ESP32-C3
            fqbn: esp32:esp32:esp32c3
            platforms: |
              - name: esp32:esp32
                source-url: https://espressif.github.io/arduino-esp32/package_esp32_index.json
            sketches: |
              - examples/RSC_Host
          - name: arduino-esp32 2.0.17, ESP32
            fqbn: esp32:esp32:esp32
            platforms: |
              - name: esp32:esp32
                source-url: https://espressif.github.io/arduino-esp32/package_esp32_index.json
                version: 2.0.17
            sketches: |
              - examples/RSC_Host
              - examples/RSC_TwoLinks
          - name: Arduino AVR, Uno
            fqbn: arduino:avr:uno
            platforms: |
              - name: arduino:avr
            sketches: |
              - examples/RSC_Host
    steps:
      - uses: actions/checkout@v7
      - uses: arduino/compile-sketches@v1
        with:
          fqbn: ${{ matrix.fqbn }}
          platforms: ${{ matrix.platforms }}
          sketch-paths: ${{ matrix.sketches }}
          cli-compile-flags: |
            - --warnings
            - all

  platformio:
    name: PlatformIO (esp32dev)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: pipx install platformio
      - run: pio run -d examples/RSC_Host
      - run: pio run -d examples/RSC_TwoLinks

  lint:
    name: Arduino Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: arduino/arduino-lint-action@v3
        with:
          project-type: library
          library-manager: "false"
