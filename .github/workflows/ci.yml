# Continuous integration for ReliableSerialComms
# - host tests (tests/host) with AddressSanitizer and UndefinedBehaviorSanitizer, against a
#   loopback model of the platform layer; default build, RSC_NO_LEGACY build, C++ syntax check
# - example sketches compiled on arduino-esp32 3.x (ESP32, ESP32-C3) and 2.0.17 (ESP32)
#   (examples/rsc_stm32 is an STM32CubeIDE fragment and is not compiled)
# - Arduino Lint (the library is not in the Library Manager)

name: CI

on:
  push:
    branches: [main, testing]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  host-tests:
    name: Host tests (${{ matrix.compiler }}, ${{ matrix.std }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        compiler: [g++, clang++]
        std: [gnu++11, c++17, c++20]
    steps:
      - uses: actions/checkout@v7
      - name: Build and run
        run: make -C tests/host CXX=${{ matrix.compiler }} STD=${{ matrix.std }}

  examples:
    name: Examples (${{ matrix.name }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: core 3.x, ESP32
            fqbn: esp32:esp32:esp32
            core: ""
          - name: core 3.x, ESP32-C3
            fqbn: esp32:esp32:esp32c3
            core: ""
          - name: core 2.0.17, ESP32
            fqbn: esp32:esp32:esp32
            core: "2.0.17"
    steps:
      - uses: actions/checkout@v7
      - name: Latest core
        if: matrix.core == ''
        uses: arduino/compile-sketches@v1
        with:
          fqbn: ${{ matrix.fqbn }}
          platforms: |
            - name: esp32:esp32
              source-url: https://espressif.github.io/arduino-esp32/package_esp32_index.json
          sketch-paths: |
            - examples/RSC_Loopback
            - examples/RSC_Poll
          cli-compile-flags: |
            - --warnings
            - all
      - name: Pinned core ${{ matrix.core }}
        if: matrix.core != ''
        uses: arduino/compile-sketches@v1
        with:
          fqbn: ${{ matrix.fqbn }}
          platforms: |
            - name: esp32:esp32
              source-url: https://espressif.github.io/arduino-esp32/package_esp32_index.json
              version: ${{ matrix.core }}
          sketch-paths: |
            - examples/RSC_Loopback
            - examples/RSC_Poll
          cli-compile-flags: |
            - --warnings
            - all

  lint:
    name: Arduino Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: arduino/arduino-lint-action@v3
        with:
          project-type: library
          library-manager: "false"
