name=ReliableSerialComms
version=2.0.0
author=Anatoli Arkhipenko <arkhipenko@hotmail.com>
maintainer=Anatoli Arkhipenko <arkhipenko@hotmail.com>
sentence=Reliable messages over a serial line: COBS framing, CRC-16, a sliding window, retransmission, and request and response tags.
paragraph=Plain C, no heap. Detects a restarted peer, keeps its queue across a broken line, and correlates each request with its progress, ACK, NACK or data response. Several links per firmware. A wire-compatible Python package is included. Examples for any Arduino (including Uno), ESP32 with FreeRTOS, and an STM32 HAL fragment.
