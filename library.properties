name=Reliable Serial Communications
version=1.1.0
author=Anatoli Arkhipenko <arkhipenko@hotmail.com>
maintainer=Anatoli Arkhipenko <arkhipenko@hotmail.com>
sentence=Framed messages over a serial byte stream, with CRC-16, correlation ids, ACK and NACK, and retries.
paragraph=Plain C. The application supplies a small platform layer (UART, queues, memory, time). Blocking task loops for an RTOS, or non-blocking poll functions for a superloop. Examples for ESP32 and an STM32 HAL fragment.
category=Communication
url=https://github.com/arkhipenko/rsc
architectures=*
